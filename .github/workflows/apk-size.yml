name: APK Size Badge

on:
  push:
    tags:
      - 'v*'

jobs:
  apk_size:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64 --analyze-size

      - name: Get APK Size and Save JSON
        run: |
          APK_SIZE=$(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)
          mkdir -p badges
          echo "{\"schemaVersion\":1,\"label\":\"APK Size\",\"message\":\"$APK_SIZE\",\"color\":\"green\"}" > badges/apk-size.json

      - name: Upload badge to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./badges
          publish_branch: gh-pages