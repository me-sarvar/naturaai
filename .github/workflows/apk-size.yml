name: Release Build

on:
  push:
    tags:
      - 'v*'  # Triggers only when a version tag like v0.1.0 is pushed

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > android/app/google-services.json

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true
          
      - name: Install NDK
        run: |
          sdkmanager "ndk;27.2.12479018"

      - name: Install dependencies
        run: flutter pub get
        
      - name: Update minSdkVersion for Firebase Auth
        run: |
          # Check if minSdkVersion needs to be updated
          GRADLE_FILE="android/app/build.gradle"
          if grep -q "minSdkVersion" "$GRADLE_FILE"; then
            # Update existing minSdkVersion to 23
            sed -i 's/minSdkVersion [0-9]*/minSdkVersion 23/' "$GRADLE_FILE"
          else
            # Insert minSdkVersion 23 inside defaultConfig block
            sed -i '/defaultConfig {/a \\        minSdkVersion 23' "$GRADLE_FILE"
          fi
          # Show the changes
          echo "Updated build.gradle:"
          cat "$GRADLE_FILE"

      - name: Build APK
        run: flutter build apk --release

      - name: Upload Release APK
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}