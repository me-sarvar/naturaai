name: APK Size Analysis

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  analyze-size:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > android/app/google-services.json

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK and Analyze Size
        run: flutter build apk --release --analyze-size --target-platform android-arm64

      - name: Upload Size Report
        uses: actions/upload-artifact@v4
        with:
          name: apk-size-analysis
          path: build/**/*.json
