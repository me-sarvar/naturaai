name: Release Build

on:
  push:
    tags:
      - 'v*'  # Triggers only when a version tag like v0.1.0 is pushed

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > android/app/google-services.json

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true
          
      - name: Install NDK and SDK 34
        run: |
          sdkmanager "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: flutter pub get
        
      - name: Verify build.gradle settings
        run: |
          echo "Verifying build.gradle has correct minSdk setting..."
          grep -n "minSdk" android/app/build.gradle

      # Add a clean step to ensure no cached build artifacts cause issues
      - name: Clean Flutter project
        run: flutter clean

      - name: Build APK with verbose output
        run: flutter build apk --release --verbose

      - name: Upload Release APK
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}