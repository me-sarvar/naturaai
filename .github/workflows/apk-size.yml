name: Analyze APK Size

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  analyze:
    name: Analyze Flutter APK Size
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK with size analysis
        run: flutter build apk --release --analyze-size

      - name: Print size analysis summary
        run: |
          echo "APK size summary:"
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          echo "Size breakdown:"
          ls -lh build/app/outputs/flutter-apk/*.json || true