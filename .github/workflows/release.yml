name: Release Build

on:
  push:
    tags:
      - 'v*'  # Triggers only when a version tag like v0.1.0 is pushed

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > android/app/google-services.json

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'

      - name: Install Android Command Line Tools and NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip openjdk-17-jdk
          
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV # For compatibility
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          
          mkdir -p "$ANDROID_SDK_ROOT"
          
          CL_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          CL_TOOLS_ZIP="$HOME/tools.zip"
          wget "$CL_TOOLS_URL" -O "$CL_TOOLS_ZIP"
          
          CL_TOOLS_DEST="$ANDROID_SDK_ROOT/cmdline-tools"
          mkdir -p "$CL_TOOLS_DEST"
          
          TEMP_UNZIP_DIR=$(mktemp -d)
          unzip "$CL_TOOLS_ZIP" -d "$TEMP_UNZIP_DIR"
          
          mv "$TEMP_UNZIP_DIR/cmdline-tools" "$CL_TOOLS_DEST/latest"
          
          rm -rf "$TEMP_UNZIP_DIR"
          rm "$CL_TOOLS_ZIP"
          
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH # Add platform-tools too
          
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true # Use || true to prevent failure on license acceptance
          
          sdkmanager "ndk;27.2.12479018"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload Release APK
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}